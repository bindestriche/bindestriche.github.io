<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Babylon.js Ball Roller</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* --- CSS FOR ON-SCREEN CONTROLS (BIGGER) --- */
        #controls {
            position: fixed;
            bottom: 30px; /* Increased spacing from edge */
            left: 30px;
            width: 240px;  /* <-- DOUBLED in size */
            height: 240px; /* <-- DOUBLED in size */
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            z-index: 10;
        }
        #controls button {
            background-color: rgba(50, 50, 50, 0.7);
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.8); /* Thicker border */
            border-radius: 16px; /* Larger radius */
            font-size: 36px;     /* Larger font */
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        #controls button:active {
            background-color: rgba(255, 255, 255, 0.7);
            color: black;
        }
        #btn-up    { grid-area: 1 / 2 / 2 / 3; }
        #btn-left  { grid-area: 2 / 1 / 3 / 2; }
        #btn-right { grid-area: 2 / 3 / 3 / 4; }
        #btn-down  { grid-area: 3 / 2 / 4 / 3; }

        /* --- CSS FOR DEBUG INFO --- */
        #debugInfo {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            z-index: 10;
        }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/cannon.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="debugInfo"></div>
    <div id="controls">
        <button id="btn-up">▲</button>
        <button id="btn-left">◀</button>
        <button id="btn-right">▶</button>
        <button id="btn-down">▼</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
