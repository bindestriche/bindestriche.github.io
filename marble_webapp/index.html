<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Marble Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    /*make the canvas be centered on the page and have a bit of border*/
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }
    canvas {
      width: 90vw;
      height: 90vh;
      max-width: 1000px;
      max-height: 800px;
      display: block;
      background: #f0f0f0;
      border: 2px solid #ccc;
      border-radius: 12px;
      box-sizing: border-box;
    }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: #fff8;
      padding: 8px;
      border-radius: 8px;
    }
    button {
      padding: 4px 8px;
      font-size: 10px;
      background-color: #007bff;
    }
  </style>
</head>
<body>
  <p>v0.02.</p>
  <div id="controls">
    <button id="resetBtn">Reset Neigung</button>
    <label>Sensitivität:
      <input type="range" id="sensitivitySlider" min="0.1" max="2" step="0.01" value="0.5">
      <span id="sensitivityValue">0.50</span>
    </label>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script src="app.js">
  
  </script>
</body>
</html>
